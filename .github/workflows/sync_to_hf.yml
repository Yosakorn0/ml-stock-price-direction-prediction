name: Sync to Hugging Face
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          lfs: true
      - name: Push to hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          # Strip offending files physically
          rm -rf images/ data/raw/ *.ipynb .gitattributes .hfignore
          # Create a fresh history starting today (removes all record of binary files)
          git checkout --orphan deploy-branch
          git add .
          git commit -m "Production deployment (history stripped)"
          # Push this NEW history to Hugging Face
          git push --force https://yosakornn:$HF_TOKEN@huggingface.co/spaces/yosakornn/stock-sentiment-analysis deploy-branch:main
