name: Sync to Hugging Face
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          lfs: true
      - name: Push to hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          # Recursively remove ALL binary images and docs that HF might reject
          find . -name "*.png" -delete
          find . -name "*.jpg" -delete
          find . -name "*.jpeg" -delete
          find . -name "*.ipynb" -delete
          rm -rf data/raw/ project_doc/
          
          # Create a fresh history starting today
          git checkout --orphan deploy-branch
          git add .
          git commit -m "Production deployment (all binaries stripped)"
          # Push this NEW history to Hugging Face
          git push --force https://yosakornn:$HF_TOKEN@huggingface.co/spaces/yosakornn/stock-sentiment-analysis deploy-branch:main
